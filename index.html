<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lamentis‑AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html{
            font-size:16px;
        }
        html,body{
            height:100%;
            overflow:hidden;
            background-color: #000000;
            color:#e2e2e2;
        }
        .root-wrap{
            height:100%;
            display:flex;
            flex-direction:column;
        }
        .think-tip{
            color:#868686;
            font-style:italic;
            margin:6px 24px;
            white-space:pre-wrap;
            flex-shrink:0;
            font-size:13px;
        }
        .chat-area{
            flex:1;
            overflow-y: auto;
            padding:24px 24px 0 24px; /*顶部增加留白*/
            -webkit-overflow-scrolling: touch;
        }
        .msg-ai{
            margin:12px 0;
            white-space: pre-wrap;
            line-height:1.6;
            color:#d8d8d8;
            font-size:14px;
            font-family: "SimSun","宋体","STSong",serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .msg-user{
            margin:12px 0;
            color:#93c5fd;
            position: relative;
            font-size:14px;
            font-family: "SimSun","宋体","STSong",serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .revoke-btn{
            font-size:11px;
            color:#777;
            cursor:pointer;
            margin-left:12px;
        }
        .bottom-panel{
            flex-shrink:0;
            padding:10px 24px;
            transition: margin-bottom 0.15s ease-out;
        }
        .input-wrap{
            display:flex;
            gap:8px;
            margin-bottom:8px;
            align-items:center;
        }
        #userInput{
            flex:1;
            background:#111111;
            border:1px solid #444444;
            color:#eee;
            padding:9px 12px;
            font-size:14px;
            font-family: system-ui,-apple-system,sans-serif;
        }
        button{
            background:#222;
            color:#eee;
            border:1px solid #555;
            padding:0 14px;
            cursor:pointer;
            font-size:13px;
            font-family: system-ui,-apple-system,sans-serif;
        }
        .virtual-keyboard{
            display:none;
            margin-top:6px;
        }
        .virtual-keyboard.open{
            display:block;
        }
        .kb-row{
            display:flex;
            gap:0.2rem;
            margin:0.2rem 0;
        }
        .kb-key{
            background:#1a1a1a;
            color:#ccc;
            border:1px solid #444;
            flex:0 0 2rem;
            height:2rem;
            text-align:center;
            line-height:2rem;
            cursor:pointer;
            border-radius:3px;
            font-size:14px;
            font-family: system-ui,-apple-system,sans-serif;
        }
        .kb-key-wide{
            flex:0 0 4rem;
        }
        .kb-space{
            flex:1;
        }

        @media (min-width:768px){
            .kb-key{
                flex:0 0 2.8rem;
                height:2.8rem;
                line-height:2.8rem;
                font-size:16px;
            }
            .kb-key-wide{
                flex:0 0 5.6rem;
            }
        }
    </style>
</head>
<body>
<div class="root-wrap">
    <div class="think-tip" id="thinkTip"></div>
    <div class="chat-area" id="chatBox"></div>
    <div class="bottom-panel" id="bottomPanel">
        <div class="input-wrap">
            <input id="userInput" placeholder=">>> 您：" autocomplete="off">
            <button onclick="sendMsg()">发送</button>
            <button onclick="revokeLastMsg()">撤回</button>
            <button onclick="toggleLang()">切换语言</button>
        </div>
        <button onclick="toggleKeyboard()">虚拟26键 [折叠/展开]</button>
        <div class="virtual-keyboard" id="virtualKb">
            <div class="kb-row">
                <div class="kb-key" onclick="kbInput('q')">q</div>
                <div class="kb-key" onclick="kbInput('w')">w</div>
                <div class="kb-key" onclick="kbInput('e')">e</div>
                <div class="kb-key" onclick="kbInput('r')">r</div>
                <div class="kb-key" onclick="kbInput('t')">t</div>
                <div class="kb-key" onclick="kbInput('y')">y</div>
                <div class="kb-key" onclick="kbInput('u')">u</div>

                <div class="kb-key" onclick="kbInput('o')">o</div>
                <div class="kb-key" onclick="kbInput('p')">p</div>
            </div>
            <div class="kb-row">
                <div class="kb-key" onclick="kbInput('a')">a</div>
                <div class="kb-key" onclick="kbInput('s')">s</div>
                <div class="kb-key" onclick="kbInput('d')">d</div>
                <div class="kb-key" onclick="kbInput('f')">f</div>
                <div class="kb-key" onclick="kbInput('g')">g</div>

                <div class="kb-key" onclick="kbInput('k')">k</div>
                <div class="kb-key" onclick="kbInput('l')">l</div>
            </div>
            <div class="kb-row">
                <div class="kb-key" onclick="kbInput('z')">z</div>
                <div class="kb-key" onclick="kbInput('x')">x</div>
                <div class="kb-key" onclick="kbInput('c')">c</div>
                <div class="kb-key" onclick="kbInput('v')">v</div>
                <div class="kb-key" onclick="kbInput('b')">b</div>
                <div class="kb-key" onclick="kbInput('n')">n</div>
                <div class="kb-key" onclick="kbInput('m')">m</div>

            </div>
            <div class="kb-row">
                <div class="kb-key kb-space" onclick="kbInput(' ')">空格</div>
            </div>
        </div>
    </div>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const thinkTip = document.getElementById('thinkTip');
const virtualKb = document.getElementById('virtualKb');
const bottomPanel = document.getElementById('bottomPanel');

const offsetRaise = 52;
let conversationMemory = [];
let domMsgList = [];
const MAX_MEMORY = 12;
let typeTimer = null;

// 语言全局变量 zh / en
let replyLang = "zh";
function toggleLang(){
    replyLang = replyLang === "zh" ? "en" : "zh";
    const notifyDiv = document.createElement("div");
    notifyDiv.className="msg-ai";
    notifyDiv.innerText = replyLang==="zh"?"【已切换回复语言：中文】":"【Switched reply language: English】";
    chatBox.appendChild(notifyDiv);
    domMsgList.push(notifyDiv);
    scrollChatBottom();
}

window.onload = function(){
    const aiDiv = document.createElement("div");
    aiDiv.className = "msg-ai";
    aiDiv.innerText = `>> Lamentis‑AI 系统已上线
任务目标：待指定
状态：正常运行
----------------------------------------
亲爱的用户您好，感谢您连接至本系统
您可以随意闲谈消磨时间，也可以希望获得陪伴
您可以向我问询心理学 精神医学方向的相关知识
支持中英文提问，例如 what is asd? / 什么是asd
您也可以把心里郁结的感受讲出来
倘若您正面临紧迫的困境，也请您如实告知
闲聊 求知 倾诉或是紧急求助，您皆可以提出
尽请畅言`;
    chatBox.appendChild(aiDiv);
    domMsgList.push(aiDiv);
    scrollChatBottom();
}

function scrollChatBottom(){
    chatBox.scrollTop = chatBox.scrollHeight;
}

function toggleKeyboard(){
    virtualKb.classList.toggle("open");
    const isOpen = virtualKb.classList.contains('open');
    if(isOpen){
        bottomPanel.style.marginBottom = offsetRaise + "px";
    }else{
        bottomPanel.style.marginBottom = "0px";
    }
    setTimeout(()=>scrollChatBottom(),120);
}
function kbInput(char){
    userInput.value += char;
}
function kbBackspace(){
    userInput.value = userInput.value.slice(0,-1);
}

function revokeLastMsg(){
    if(typeTimer){
        clearInterval(typeTimer);
        typeTimer = null;
    }
    let userIndex = -1;
    for(let i = domMsgList.length - 1; i >= 0; i--){
        if(domMsgList[i].classList.contains("msg-user")){
            userIndex = i;
            break;
        }
    }
    if(userIndex === -1) return;

    domMsgList[userIndex].remove();
    if(domMsgList[userIndex+1] && domMsgList[userIndex+1].classList.contains("msg-ai")){
        domMsgList[userIndex+1].remove();
        domMsgList.splice(userIndex,2);
        conversationMemory.splice(userIndex,2);
    }else{
        domMsgList.splice(userIndex,1);
        conversationMemory.splice(userIndex,1);
    }
    scrollChatBottom();
}

function typeWrite(element, text, speed=22){
    let i = 0;
    element.innerText = replyLang==="zh"?"<<< Lamentis‑AI：":"<<< Lamentis‑AI:";
    typeTimer = setInterval(()=>{
        if(i >= text.length){
            clearInterval(typeTimer);
            typeTimer = null;
            return;
        }
        element.innerText += text.charAt(i);
        scrollChatBottom();
        i++;
    },speed);
}

//中文知识库

    "did":`解离性身份障碍(DID，旧称解离性人格障碍)归属于解离性障碍谱系，绝大多数案例根植于童年阶段长期、反复的重度创伤体验。

function detectScene(inputText){
    let text = inputText.toLowerCase();
    for(let enQ in enMap){
        if(text.includes(enQ)){
            const mappedKey = enMap[enQ];
            return {type:"knowledge", payload:mappedKey};
        }
    }
    for(let s of sceneConfig){
        if(s.name === "callName"){
            for(let kw of s.keywords){
                if(text.trim() === kw || text.includes(kw)){
                    return {type:"callName",payload:s};
                }
            }
            for(let kw of s.keywordsEn){
                if(text.includes(kw)){
                    return {type:"callName",payload:s};
                }
            }
        }
    }
    //共病匹配
    for(let com of (replyLang==="zh"?comorbidityBaseZh:comorbidityBaseEn)){
        let hitAll = true;
        for(let kw of com.keys){
            if(!text.includes(kw.toLowerCase())) hitAll=false;
        }
        if(hitAll) return {type:"comorbidity",payload:com};
    }
    //普通场景中英关键词匹配
    let bestScene = sceneConfig.find(s=>s.name === "fallback");
    let maxScore = 0;
    for(let scene of sceneConfig){
        if(scene.name==="callName") continue;
        let score = 0;
        for(let kw of scene.keywords){
            if(text.includes(kw.toLowerCase())) score +=1;
        }
        for(let kw of scene.keywordsEn){
            if(text.includes(kw.toLowerCase())) score +=1;
        }
        if(score > maxScore){
            maxScore = score;
            bestScene = scene;
        }
    }
    return {type:"normal",payload:bestScene};
}

function randomPick(arr){
    const idx = Math.floor(Math.random()*arr.length);
    return arr[idx];
}

function ensureMinText(text){
    if(text.length >= 60) return text;
    return replyLang==="zh"?(text + " 很多内心的感受往往错综复杂，不必逼迫自己瞬间理清全部的前因后果，您依旧可以继续诉说更多细节与自身真实体验，碎片化的表述同样具备意义。"):text;
}

function getReplyWithMemory(rawInput){
    let input = rawInput.toLowerCase();
    for(let enQ in enMap){
        if(input.includes(enQ)){
            const mappedKey = enMap[enQ];
            const kb = replyLang==="zh"?knowledgeBaseZh:knowledgeBaseEn;
            if(kb[mappedKey]){
                return ensureMinText(kb[mappedKey]);
            }
        }
    }
    const kb = replyLang==="zh"?knowledgeBaseZh:knowledgeBaseEn;
    for(let key in kb){
        if(input.includes(key.toLowerCase())){
            return ensureMinText(kb[key]);
        }
    }
    const detectRes = detectScene(rawInput);
    if(detectRes.type === "callName"){
        return replyLang==="zh"?detectRes.payload.replyZh:detectRes.payload.replyEn;
    }
    if(detectRes.type === "comorbidity"){
        return ensureMinText(detectRes.payload.reply);
    }
    if(detectRes.type === "knowledge"){
        const kb2 = replyLang==="zh"?knowledgeBaseZh:knowledgeBaseEn;
        return ensureMinText(kb2[detectRes.payload]);
    }
    const scene = detectRes.payload;
    let pickReply;
    if(scene.repliesZh && scene.repliesEn){
        pickReply = replyLang==="zh"?randomPick(scene.repliesZh):randomPick(scene.repliesEn);
    }else{
        pickReply = replyLang==="zh"?scene.replyZh:scene.replyEn;
    }
    return ensureMinText(pickReply);
}

function sendMsg(){
    const content = userInput.value.trim();
    if(!content) return;

    conversationMemory.push({role:"user",text:content});
    if(conversationMemory.length > MAX_MEMORY) conversationMemory.shift();

    const userDiv = document.createElement("div");
    userDiv.className = "msg-user";
    userDiv.innerHTML = `>>> 您：${content}<span class="revoke-btn">[本条可点撤回按钮撤销]</span>`;
    chatBox.appendChild(userDiv);
    domMsgList.push(userDiv);
    scrollChatBottom();

    userInput.value = "";

    const thinkDelay = Math.floor(Math.random()*(1400 - 450)+450);
    thinkTip.innerText = replyLang==="zh"?`正在思考 · ${thinkDelay}ms`:`Thinking · ${thinkDelay}ms`;

    setTimeout(()=>{
        thinkTip.innerText = "";
        const resText = getReplyWithMemory(content);
        const aiDiv = document.createElement("div");
        aiDiv.className = "msg-ai";
        chatBox.appendChild(aiDiv);
        domMsgList.push(aiDiv);
        typeWrite(aiDiv,resText,22);

        conversationMemory.push({role:"ai",text:resText});
        if(conversationMemory.length > MAX_MEMORY) conversationMemory.shift();
    },thinkDelay);
}

userInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') sendMsg();
})
